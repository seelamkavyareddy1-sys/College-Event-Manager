<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Engineering Portal</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --dark: #0f172a; --bg: #f1f5f9; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; }
        
        /* Auth Screens */
        #login-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--dark); }
        .login-card { background: white; padding: 2.5rem; border-radius: 15px; width: 350px; text-align: center; }
        
        nav { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { width: 95%; max-width: 1100px; margin: 2rem auto; display: none; }
        .box { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        
        .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid white; color: white; font-size: 0.8rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 400px; }
        .badge { background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="login-card">
        <h2>🎓 CampusHub</h2>
        <input type="text" id="username" placeholder="Username (admin / student)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()" class="btn-primary">Login</button>
        <p style="font-size:0.75rem; color:#64748b; margin-top:10px;">Admin: admin / admin | Student: student / student</p>
    </div>
</div>

<nav id="main-nav" style="display:none;">
    <div style="font-weight:bold;">CampusHub <span id="role-tag" style="color:var(--success)"></span></div>
    <button onclick="location.reload()" class="btn-outline">Logout</button>
</nav>

<div id="student-dashboard" class="container">
    <h2>Available Workshops</h2>
    <div class="event-grid" id="event-list"></div>
</div>

<div id="admin-dashboard" class="container">
    <div class="box">
        <h3>Create Event</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
            <input type="text" id="new-title" placeholder="Event Name">
            <input type="text" id="new-date" placeholder="Date">
            <input type="number" id="new-cap" placeholder="Capacity">
            <select id="new-branch">
                <option value="All">All Branches</option>
                <option value="CSE">CSE (General)</option>
                <option value="CSM">CSM (AI & ML)</option>
                <option value="CSD">CSD (Data Science)</option>
                <option value="CSIT">CSIT</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
            </select>
        </div>
        <button onclick="addEvent()" class="btn-success" style="margin-top:10px;">Publish Workshop</button>
    </div>

    <div class="box">
        <h3>Participant Database</h3>
        <table id="admin-table">
            <thead>
                <tr><th>Roll No</th><th>Name</th><th>Branch</th><th>Event</th></tr>
            </thead>
            <tbody id="participant-rows"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="regModal">
    <div class="modal-content">
        <h3 id="m-title"></h3>
        <input type="hidden" id="m-id">
        <input type="text" id="s-roll" placeholder="Roll Number">
        <input type="text" id="s-name" placeholder="Full Name">
        <select id="s-branch">
            <option>CSE (General)</option>
            <option>CSM (AI & ML)</option>
            <option>CSD (Data Science)</option>
            <option>CSIT</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>
        <button onclick="submitReg()" class="btn-primary">Confirm</button>
        <button onclick="closeModal()" style="background:none; width:100%; margin-top:5px; color:gray;">Cancel</button>
    </div>
</div>

<script>
    // Load data from LocalStorage or use defaults
    let events = JSON.parse(localStorage.getItem('events')) || [
        { id: 1, title: "Cloud Architecture", date: "Feb 15", capacity: 50, registered: 0, branch: "All" },
        { id: 2, title: "Python for Data Science", date: "Feb 18", capacity: 40, registered: 0, branch: "CSD" }
    ];
    let students = JSON.parse(localStorage.getItem('students')) || [];

    function saveData() {
        localStorage.setItem('events', JSON.stringify(events));
        localStorage.setItem('students', JSON.stringify(students));
    }

    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (u === 'admin' && p === 'admin') showDashboard('admin');
        else if (u === 'student' && p === 'student') showDashboard('student');
        else alert("Invalid credentials");
    }

    function showDashboard(role) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-nav').style.display = 'flex';
        document.getElementById('role-tag').innerText = `(${role.toUpperCase()})`;
        
        if (role === 'admin') {
            document.getElementById('admin-dashboard').style.display = 'block';
            updateAdminTable();
        } else {
            document.getElementById('student-dashboard').style.display = 'block';
            renderEvents();
        }
    }

    function renderEvents() {
        const list = document.getElementById('event-list');
        list.innerHTML = '';
        events.forEach(ev => {
            const isFull = ev.registered >= ev.capacity;
            list.innerHTML += `
                <div class="box">
                    <span class="badge">${ev.branch}</span>
                    <h3>${ev.title}</h3>
                    <p>📅 ${ev.date} | 👥 ${ev.registered}/${ev.capacity}</p>
                    <button class="btn-primary" onclick="openModal(${ev.id},'${ev.title}')" ${isFull ? 'disabled' : ''}>
                        ${isFull ? 'Full' : 'Register'}
                    </button>
                </div>`;
        });
    }

    function openModal(id, title) {
        document.getElementById('m-id').value = id;
        document.getElementById('m-title').innerText = title;
        document.getElementById('regModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('regModal').style.display = 'none'; }

    function submitReg() {
        const id = parseInt(document.getElementById('m-id').value);
        const roll = document.getElementById('s-roll').value;
        const name = document.getElementById('s-name').value;
        const branch = document.getElementById('s-branch').value;

        if(!roll || !name) return alert("Fill all fields");

        const ev = events.find(e => e.id === id);
        ev.registered++;
        students.push({ roll, name, branch, event: ev.title });
        
        saveData();
        alert("Registered!");
        closeModal();
        renderEvents();
    }

    function addEvent() {
        const title = document.getElementById('new-title').value;
        const date = document.getElementById('new-date').value;
        const cap = document.getElementById('new-cap').value;
        const branch = document.getElementById('new-branch').value;
        
        if(!title || !date) return alert("Enter details");
        
        events.push({ id: Date.now(), title, date, capacity: parseInt(cap), registered: 0, branch });
        saveData();
        alert("Event Created!");
        renderEvents();
    }

    function updateAdminTable() {
        const tbody = document.getElementById('participant-rows');
        tbody.innerHTML = students.map(s => `
            <tr><td>${s.roll}</td><td>${s.name}</td><td>${s.branch}</td><td>${s.event}</td></tr>
        `).join('');
    }
</script>
</body>
  </html>
